server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # Basic hardening formerly configured on the static-site host.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # HTML should update immediately after a new image is deployed.
    location ~* \.html$ {
        expires -1;
        try_files $uri =404;
    }

    # Versioned/static assets may be cached by browsers between deployments.
    location ~* \.(?:css|js|jpg|jpeg|gif|ico|png|svg|webp|woff|woff2)$ {
        expires 7d;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
