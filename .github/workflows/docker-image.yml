name: Docker Image CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Login to Docker Hub
      run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
  
    - name: Build the Docker image
      run: |
        TAG=$(date +%s)
        docker build . --file Dockerfile --tag vit100/steamul-web:$TAG
        docker tag vit100/steamul-web:$TAG vit100/steamul-web:latest
    - name: Push to github
      run: |
        TAG=$(date +%s)
        docker push vit100/steamul-web:$TAG
        docker push vit100/steamul-web:latest
        
