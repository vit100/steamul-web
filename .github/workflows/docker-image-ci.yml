name: Docker Image CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Generate tag
      id: generate-tag
      run: echo "tag=$(date +%s)" >> $GITHUB_OUTPUT
    
    - name: Login to Docker Hub
      run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
  
    - name: Build the Docker image
      run: |
        docker build . --file Dockerfile --tag vit100/steamul-web:${{ steps.generate-tag.outputs.tag }}
        docker tag vit100/steamul-web:${{ steps.generate-tag.outputs.tag }} vit100/steamul-web:latest
        
    - name: Push to github
      run: |
        docker push vit100/steamul-web:${{ steps.generate-tag.outputs.tag }}
        docker push vit100/steamul-web:latest
